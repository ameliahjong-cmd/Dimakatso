<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Farmasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">FARMASI</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="skincare.html">Skincare</a></li>
        <li><a href="wellness.html">Wellness & Fitness</a></li>
        <li><a href="makeup.html">Makeup & Fragrance</a></li>
        <li><a href="cart.html" class="cart-icon-btn active">🛒 Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Your Shopping Cart</h1>
    
    <div id="cart-content-area">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- Dynamically filled by JavaScript -->
        </tbody>
      </table>

      <div class="cart-total-section">
        <h3>Total: $<span id="cart-total">0.00</span></h3>
        <button class="btn" onclick="checkoutWhatsApp()" style="background-color: #25d366; font-size: 1.1rem; padding: 0.8rem 1.5rem;">
          Order via WhatsApp (+267 74525158) 📱
        </button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Farmasi Independent Influencer | Order via WhatsApp: +267 74525158</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    function renderCartPage() {
      let tbody = document.getElementById('cart-items');
      let totalSpan = document.getElementById('cart-total');
      
      if (!tbody) return;

      tbody.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--gray);">Your cart is empty.</td></tr>`;
        totalSpan.innerText = '0.00';
        return;
      }

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;

        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>${item.quantity}</td>
            <td>$${itemTotal.toFixed(2)}</td>
            <td><button class="btn" style="background-color: #d9534f; padding: 0.3rem 0.6rem;" onclick="removeItem(${index})">Remove</button></td>
          </tr>
        `;
      });

      totalSpan.innerText = total.toFixed(2);
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      renderCartPage();
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let message = "Hello! I would like to place an order for the following Farmasi products:\n\n";
      let total = 0;

      cart.forEach(item => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;
        message += `- ${item.name} (Qty: ${item.quantity}) - $${itemTotal.toFixed(2)}\n`;
      });

      message += `\nTotal Amount: $${total.toFixed(2)}`;

      let encodedMessage = encodeURIComponent(message);
      let whatsappUrl = `https://wa.me/26774525158?text=${encodedMessage}`;
      
      window.open(whatsappUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });
  </script>
</body>
</html>
